name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to deploy (e.g. v2.16.0-weolbu.1)'
        required: true
        type: string

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: weolbu/n8n
  ECS_CLUSTER: weolbu-prod-cluster
  ECS_SERVICE: weolbu-n8n-service
  TASK_FAMILY: weolbu-n8n

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build n8n and Docker image
        env:
          IMAGE_BASE_NAME: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: pnpm build:docker

      - name: Update ECS task definition and deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_TAG}"

          # Get current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query 'taskDefinition' \
            --output json)

          # Update image in container definitions
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$ECR_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          # Register new task definition revision
          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition: $NEW_REVISION"

          # Update ECS service with new task definition
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "$NEW_REVISION"

          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

          echo "Deployment complete: ${DEPLOY_TAG}"
